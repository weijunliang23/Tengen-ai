# Electron Builder 配置
# Windows 打包：npm run electron:build（本机可直接生成 NSIS 安装包）
# macOS 打包：npm run electron:build:mac（需在 macOS 或 CI 上执行，签名/公证见下）

appId: com.goboard.app
productName: GoBoard
directories:
  output: release
  buildResources: build

files:
  - dist/**
  - dist-electron/**
  - package.json

asar: true

# ---------- Windows ----------
win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 围棋

# ---------- macOS ----------
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  category: public.app-category.games
  hardenedRuntime: true
  # 正式分发需 Apple 开发者证书；在 CI 中设置 CSC_LINK / CSC_KEY_PASSWORD 即可
  # identity: "Developer ID Application: Your Name (TEAMID)"
  # 公证（需 APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID）：
  # notarize: true

dmg:
  title: ${productName} ${version}
  artifactName: ${productName}-${version}-${arch}.${ext}
